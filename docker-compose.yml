services:

  # ---------------------------------------------------------------------------
  # Lab image registry (plain HTTP, insecure — internal only)
  # Accessible from workstation as localhost:5000
  # Accessible from the hypervisor host LXCs as ${REGISTRY_HOST}
  # ---------------------------------------------------------------------------
  lab-registry:
    image: registry:2
    container_name: lab-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - lab-net

  # ---------------------------------------------------------------------------
  # Docker-in-Docker daemon (Jenkins builds inside this, via DOCKER_HOST)
  # Privileged is required for DinD. Never use in production.
  # ---------------------------------------------------------------------------
  lab-dind:
    image: docker:27.4-dind
    container_name: lab-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""            # No TLS in lab; Jenkins connects on plain 2375
    command: --insecure-registry=lab-registry:5000
    volumes:
      - dind-storage:/var/lib/docker
      # Share jenkins-home at the same path so -v $(pwd):/work bind-mounts work
      # when Jenkins spawns containers via the DinD daemon (classic DinD volume problem)
      - jenkins-home:/var/jenkins_home
    networks:
      - lab-net

  # ---------------------------------------------------------------------------
  # Jenkins LTS (custom image with Docker CLI + cosign)
  # Build: docker compose build lab-jenkins
  # ---------------------------------------------------------------------------
  lab-jenkins:
    build:
      context: stage3/jenkins
      dockerfile: Dockerfile
    container_name: lab-jenkins
    restart: unless-stopped
    depends_on:
      - lab-dind
      - lab-registry
    environment:
      DOCKER_HOST: "tcp://lab-dind:2375"  # Talk to DinD, not host socket
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD}"
      COSIGN_PASSWORD: "${COSIGN_PASSWORD}"
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dcasc.jenkins.config=/var/jenkins_home/casc.yaml
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    ports:
      - "8080:8080"        # Jenkins UI
      - "50000:50000"      # JNLP agents (unused in lab but standard)
    volumes:
      - jenkins-home:/var/jenkins_home
      # Mount casc config and the lab repo for pipeline access
      - ./stage3/jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
      - .:/workspace:ro    # Entire lab repo available to pipeline
      # Private key for cosign (generated by gen-keys step; git-ignored)
      - ./keys/cosign.key:/run/secrets/cosign.key:ro
      # Base64-encoded key for JCasC file credential (generated by gen-keys step; git-ignored)
      - ./keys/cosign_key_b64:/run/secrets/cosign_key_b64:ro
    networks:
      - lab-net

volumes:
  registry-data:
  dind-storage:
  jenkins-home:

networks:
  lab-net:
    driver: bridge

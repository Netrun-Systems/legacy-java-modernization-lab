---
# Hiera node data for legacy-app (Jetty 9.4 / legacy-app host)
# IP: ${LEGACY_HOST} | Ubuntu 24.04

# Jetty 9.4 runs as a systemd unit (not Docker) to test real service management.
# The WAR is deployed directly into the Jetty 9.4 base via the
# petclinic::legacy class — no container runtime needed on this node.

petclinic::mode: "legacy"
petclinic::jetty_version: "9.4.58.v20250814"
petclinic::jetty_port: 8080

# Connects to MySQL primary — same datasource as container-app so
# HAProxy parity testing uses a shared data set.
# Replace db.lab.example with your db hostname (from $DB_HOST in .env).
# Puppet/Hiera does not expand shell ${} variables; use a literal value here.
petclinic::jdbc_url: "jdbc:mysql://db.lab.example:3306/petclinic"

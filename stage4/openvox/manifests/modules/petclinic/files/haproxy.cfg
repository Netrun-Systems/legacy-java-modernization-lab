#
# legacy-java-modernization-lab Stage 4 — HAProxy 2.9 configuration
# Two backends: legacy-app (Jetty 9.4) and container-app (Jetty 12.1)
#
# Weight flip strategy:
#   Phase 1 (lab start): legacy weight=100, container weight=0
#     → 100% traffic to Jetty 9.4 baseline
#   Phase 2 (canary): legacy weight=90, container weight=10
#     → 10% traffic to Jetty 12 to catch regressions
#   Phase 3 (cutover): legacy weight=0, container weight=100
#     → 100% to Jetty 12; legacy still in pool for instant rollback
#
# Flip via HAProxy admin socket (see scripts/flip-weights.sh):
#   echo "set weight petclinic/container-app 10" | socat - /var/run/haproxy/admin.sock
#
# Routing note: HAProxy proxies /petclinic/* but the apps expect the
# context path. The WAR deploys at /petclinic/ on both Jetty versions
# because of the WAR name (petclinic.war → /petclinic context).
#

global
    log stdout format raw local0 info
    maxconn 1000
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client  30s
    timeout server  60s
    retries 2
    default-server inter 3s rise 2 fall 3

# ---------------------------------------------------------------------------
# Stats UI + Prometheus metrics (port 8404, internal only)
#   http://${LB_HOST}:8404/stats   — HAProxy stats page
#   http://${LB_HOST}:8404/metrics — Prometheus scrape endpoint
# ---------------------------------------------------------------------------
frontend stats
    bind *:8404
    mode http
    # Prometheus built-in exporter (HAProxy 2.0.4+)
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    no log

# ---------------------------------------------------------------------------
# PetClinic frontend — accepts external traffic on :80
# ---------------------------------------------------------------------------
frontend petclinic-front
    bind *:80
    default_backend petclinic

# ---------------------------------------------------------------------------
# PetClinic backend — weighted round-robin
# ---------------------------------------------------------------------------
backend petclinic
    balance roundrobin
    option httpchk
    http-check send meth GET uri /petclinic/owners?lastName= ver HTTP/1.1 hdr Host localhost

    # legacy-app: Jetty 9.4 on legacy-app (${LEGACY_HOST}), port 8080
    # weight 100 at lab start; set to 0 after successful cutover
    server legacy-app ${LEGACY_HOST}:8080 weight 100 check inter 5s

    # container-app: Jetty 12.1 on container-app (${CONTAINER_HOST}), port 8080
    # weight 0 at lab start; ramp up during migration
    server container-app ${CONTAINER_HOST}:8080 weight 0 check inter 5s

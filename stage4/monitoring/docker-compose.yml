# Modernization Lab monitoring stack — Prometheus + Alertmanager + Grafana + webhook-sink
# All images pinned by sha256; pulled 2026-10-30 on the monitor host (Docker 29.9.2).
#
# Image pins:
#   prometheus    v2.54.1  sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
#   alertmanager  v0.27.0  sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
#   grafana       11.2.0   sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
#   python        3.12-alpine sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
#
# Grafana admin password: set GF_SECURITY_ADMIN_PASSWORD in .env.monitoring
# (gitignored; generate with: openssl rand -base64 18)
# Access:
#   Prometheus:    http://${MONITOR_HOST}:9090
#   Alertmanager:  http://${MONITOR_HOST}:9093
#   Grafana:       http://${MONITOR_HOST}:3000
#   Webhook sink:  http://${MONITOR_HOST}:5001  (GET = tail of webhooks.jsonl)

services:
  prometheus:
    image: prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:9090'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=0.0.0.0:9093'
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring

  webhook-sink:
    image: python@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    container_name: webhook-sink
    restart: unless-stopped
    command: python /app/webhook_sink.py
    ports:
      - "5001:5001"
    volumes:
      - ./webhook_sink/webhook_sink.py:/app/webhook_sink.py:ro
      - webhook_sink_data:/data
    networks:
      - monitoring

  grafana:
    image: grafana/grafana@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SERVER_HTTP_PORT: "3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge
    name: lab-monitoring

volumes:
  prometheus_data:
    name: prometheus-data
  alertmanager_data:
    name: alertmanager-data
  grafana_data:
    name: grafana-data
  webhook_sink_data:
    name: webhook-sink-data

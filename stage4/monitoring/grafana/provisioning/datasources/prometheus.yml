---
# Grafana datasource provisioning — Prometheus.
# This file is mounted at /etc/grafana/provisioning/datasources/ in the container.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: GET
